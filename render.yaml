# =========================================================================
# IntelliDesk Render Blueprint (Infrastructure as Code)
# https://render.com/docs/blueprint-spec
# =========================================================================

services:
  # 1. Redis Key-Value Store (OTP TTL & Session Cache)
  - type: keyvalue
    name: intellidesk-redis
    plan: free
    ipAllowList: []

  # 2. IntelliDesk Spring Boot 3 Java 21 Backend Web Service
  - type: web
    name: intellidesk-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://dpg-dbtkkls9v7es739a8mfg-a:5432/library_db_cb50
      - key: DB_USER
        value: library_user
      - key: DB_PASSWORD
        value: M1PO4kzYnoNMMe6mxC2Jda5OlDt6yK0v
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: intellidesk-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: intellidesk-redis
          property: port
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: mock

  # 3. IntelliDesk React 18 Single Page Application (Global CDN Edge)
  - type: web
    runtime: static
    name: intellidesk-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://intellidesk-backend-sbkn.onrender.com
