# =========================================================================
# IntelliDesk Render Blueprint (Infrastructure as Code)
# https://render.com/docs/blueprint-spec
# =========================================================================

databases:
  # 1. PostgreSQL 16 with Native pgvector Support
  - name: intellidesk-postgres
    databaseName: intellidesk_db
    user: postgres
    plan: free
    postgresMajorVersion: 16

services:
  # 2. Redis 7 In-Memory Cache (OTP TTL & Session Cache)
  - type: redis
    name: intellidesk-redis
    plan: free
    ipAllowList: []

  # 3. IntelliDesk Spring Boot 3 Java 21 Backend Web Service
  - type: web
    name: intellidesk-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: intellidesk-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: intellidesk-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: intellidesk-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: intellidesk-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: intellidesk-postgres
          property: password
      - key: REDIS_HOST
        fromService:
          type: redis
          name: intellidesk-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: intellidesk-redis
          property: port
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SMS_PROVIDER
        value: mock

  # 4. IntelliDesk React 18 Single Page Application (Global CDN Edge)
  - type: static
    name: intellidesk-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: intellidesk-backend
          property: url
