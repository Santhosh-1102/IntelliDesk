# =========================================================================
# IntelliDesk Core Backend Configuration
# =========================================================================

spring.application.name=intellidesk-backend
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# -------------------------------------------------------------------------
# Database (PostgreSQL + pgvector)
# -------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intellidesk_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------------
# 256-bit HMAC secret key for token signing (override via environment variable)
intellidesk.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Token validity: 86,400,000 milliseconds = 24 hours
intellidesk.jwt.expiration-ms=86400000

# -------------------------------------------------------------------------
# Spring AI & LLM Configuration
# -------------------------------------------------------------------------
spring.ai.openai.api-key=${OPENAI_API_KEY:mock-key-for-development}
spring.ai.openai.chat.options.model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.2
spring.ai.openai.embedding.options.model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

# -------------------------------------------------------------------------
# Document Ingestion & Storage Limits
# -------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
intellidesk.upload.directory=uploads/documents
