# =========================================================================
# IntelliDesk Core Backend Configuration
# =========================================================================

spring.application.name=intellidesk-backend
server.port=${PORT:8080}
server.error.include-message=always
server.error.include-binding-errors=always

# -------------------------------------------------------------------------
# Database (PostgreSQL + pgvector)
# -------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:intellidesk_db}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgrespassword}}
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------------
# Security & JWT Configuration
# -------------------------------------------------------------------------
# 256-bit HMAC secret key for token signing (override via environment variable)
intellidesk.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# Token validity: 86,400,000 milliseconds = 24 hours
intellidesk.jwt.expiration-ms=86400000

# -------------------------------------------------------------------------
# Redis Cache Configuration (OTP & Session Cache)
# -------------------------------------------------------------------------
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# -------------------------------------------------------------------------
# Spring AI & LLM Configuration (Google Gemini via OpenAI-Compatible Endpoint)
# -------------------------------------------------------------------------
spring.ai.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.api-key=${GEMINI_API_KEY:${AI_API_KEY:mock-key-for-development}}
spring.ai.openai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.embedding.enabled=false

# -------------------------------------------------------------------------
# Document Ingestion & Storage Limits
# -------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
intellidesk.upload.directory=uploads/documents

# -------------------------------------------------------------------------
# SMS Delivery Gateway
# Provider options: mock (default for development), fast2sms, twilio
# -------------------------------------------------------------------------
intellidesk.sms.provider=${SMS_PROVIDER:mock}
intellidesk.sms.fast2sms.api-key=${FAST2SMS_API_KEY:}
intellidesk.sms.fast2sms.otp-id=${FAST2SMS_OTP_ID:}
